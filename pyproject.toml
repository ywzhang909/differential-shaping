[project]
name = "differential-shaping"
version = "0.1.0"
description = "H-GD / SPGD / Torch-GD wavefront-sensorless adaptive optics simulation (PyTorch physics + autograd DM-phase optimization)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "torch>=2.5",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/differential_shaping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true